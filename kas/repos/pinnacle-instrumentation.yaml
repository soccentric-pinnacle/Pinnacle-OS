header:
  version: 14

repos:
  # Pinnacle-Instrumentation ships its own Yocto layer (yocto/, collection
  # name "instrumentation"). NOT yet added to any IMAGE_INSTALL: the
  # recipe's COMPATIBLE_MACHINE list does not include
  # imx93-11x11-lpddr4x-frdm (Pinnacle's board) and has no
  # devices/capabilities/resource-profile descriptors for it — both
  # leftover from this leaf starting as an unadapted
  # Arches-Instrumentation copy. Adding the "instrumentation" package to
  # IMAGE_INSTALL before that is fixed would fail the build ("nothing
  # provides instrumentation"), not just ship an empty package. See
  # Pinnacle-Instrumentation/yocto's layer.conf and instrumentation.bb for
  # the parts still needing board-specific work.
  pinnacle-instrumentation:
    url: git@github.com:soccentric-pinnacle/Pinnacle-Instrumentation.git
    branch: develop
    path: meta/pinnacle-instrumentation
    layers:
      yocto:
