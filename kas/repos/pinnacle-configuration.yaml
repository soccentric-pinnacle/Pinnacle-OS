header:
  version: 14

repos:
  # Pinnacle-Configuration ships its own meta-webconfig Yocto layer (the
  # on-device WebConfig daemon + static frontend + schemas + board
  # manifest). Only that subdirectory is a layer; the rest of the repo
  # (Rust workspace, frontend source) is not needed by the build.
  pinnacle-configuration:
    url: https://github.com/soccentric-pinnacle/Pinnacle-Configuration.git
    branch: develop
    path: meta/pinnacle-configuration
    layers:
      meta-webconfig:
